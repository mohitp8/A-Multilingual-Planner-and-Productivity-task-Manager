<!DOCTYPE html><html lang="en" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Settings — Hitmo Planner</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css"><script src="https://unpkg.com/lucide@latest"></script><script src="js/auth.js"></script><script src="js/apiClient.js"></script><script src="js/i18n.js"></script><script src="js/app-extensions.js"></script></head>
<body class="bg-mesh-dark text-slate-100 min-h-screen p-5 md:p-10"><main class="max-w-2xl mx-auto"><header class="mb-8 flex items-start justify-between gap-4"><div><a href="/app" class="text-xs text-indigo-400" data-i18n="backDashboard">← Back to dashboard</a><h1 class="text-3xl font-bold mt-3" data-i18n="settings">Settings</h1></div><select id="pageLanguage" class="form-input w-auto"><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option><option value="es">Español</option><option value="fr">Français</option><option value="pt">Português</option></select></header><section class="glass-card rounded-2xl p-6 space-y-5"><div><label class="text-xs text-slate-500" data-i18n="interfaceLanguage">Interface language</label><select id="language" class="form-input w-full mt-1"><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option><option value="es">Español</option><option value="pt">Português</option><option value="fr">Français</option></select></div><div><label class="text-xs text-slate-500" data-i18n="theme">Theme</label><select id="theme" class="form-input w-full mt-1"><option value="dark" data-i18n="dark">Dark</option><option value="light" data-i18n="light">Light</option></select></div><label class="flex items-center gap-3"><input id="notifications" type="checkbox" class="w-4 h-4" checked> <span data-i18n="notificationsEnabled">Notifications enabled</span></label><label class="flex items-center gap-3"><input id="ai" type="checkbox" class="w-4 h-4" checked> <span data-i18n="aiEnabled">AI assistant enabled</span></label><button id="save" class="px-5 py-2.5 rounded-xl bg-indigo-600 font-semibold" data-i18n="save">Save Settings</button><p id="status" class="text-sm text-slate-400"></p></section></main><script>(async()=>{if(!await authManager.isAuthenticated()){location.replace('/login.html');return;}try{const p=await apiClient.request('/preferences');document.getElementById('language').value=p.language||'en';document.getElementById('theme').value=p.theme||'dark';document.getElementById('notifications').checked=!!p.notifications_enabled;document.getElementById('ai').checked=!!p.ai_enabled;}catch(e){document.getElementById('status').textContent=e.message;}document.getElementById('save').onclick=async()=>{try{const v={language:document.getElementById('language').value,theme:document.getElementById('theme').value,notificationsEnabled:document.getElementById('notifications').checked,aiEnabled:document.getElementById('ai').checked};await apiClient.request('/preferences','PUT',v);localStorage.setItem('hitmo_lang',v.language);localStorage.setItem('theme',v.theme);document.documentElement.classList.toggle('dark',v.theme==='dark');document.documentElement.classList.toggle('light',v.theme!=='dark');if(window.i18n)i18n.setLanguage(v.language);document.getElementById('status').textContent=i18n.t('saved')}catch(e){document.getElementById('status').textContent=e.message;}}})();document.documentElement.classList.toggle('light',localStorage.getItem('theme')==='light');document.documentElement.classList.toggle('dark',localStorage.getItem('theme')!=='light');document.addEventListener('DOMContentLoaded',()=>{if(window.i18n){i18n.applyLanguage();const s=document.getElementById('pageLanguage');if(s){s.value=i18n.getCurrentLanguage();s.onchange=()=>i18n.setLanguage(s.value);}}});lucide.createIcons();</script></body></html>
