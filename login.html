<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitmo's Planner — Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151f30', 900: '#0f172a', 950: '#080c16' },
                        dark: { bg: '#060911', card: '#0c1220', border: '#1e293b', surface: '#172033', hover: '#1e2d47' },
                        primary: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
                        accent: { 500: '#06b6d4', 600: '#0891b2' }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta Sans:wght@300;400;500;600;700;800&family=JetBrains Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/i18n.js"></script><script src="js/auth.js"></script>
    <style>
        .auth-glass {
            background: rgba(12, 18, 32, 0.85);
            backdrop-filter: blur(32px) saturate(180%);
            -webkit-backdrop-filter: blur(32px) saturate(180%);
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 24px 64px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .form-input-glow:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.2), 0 0 20px rgba(99,102,241,0.1);
        }
        .gradient-btn {
            background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
            transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
            position: relative;
            overflow: hidden;
        }
        .gradient-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .gradient-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99,102,241,0.4); }
        .gradient-btn:hover::before { opacity: 1; }
        .gradient-btn:active { transform: translateY(0); }
        .social-btn {
            transition: all 0.2s cubic-bezier(0.16,1,0.3,1);
        }
        .social-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(20px, -30px); }
            66% { transform: translate(-15px, 20px); }
        }
        .input-shine {
            position: relative;
        }
        .input-shine::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.03) 50%, transparent 60%);
            pointer-events: none;
        }
        .lock-icon {
            animation: arcReactor 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-dark-bg text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4 overflow-hidden relative"><div class="fixed top-4 right-4 z-50"><select id="pageLanguage" class="form-input text-xs w-auto"><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option><option value="es">Español</option><option value="fr">Français</option><option value="pt">Português</option></select></div>

    <!-- Animated Background Orbs -->
    <div class="orb w-96 h-96 bg-indigo-600 top-[-10%] left-[-5%]" style="animation-delay: 0s;"></div>
    <div class="orb w-80 h-80 bg-cyan-600 bottom-[-5%] right-[-5%]" style="animation-delay: 2s;"></div>
    <div class="orb w-72 h-72 bg-purple-600 top-[40%] right-[20%]" style="animation-delay: 4s;"></div>

    <!-- Grid Pattern Overlay -->
    <div class="fixed inset-0 opacity-[0.03] pointer-events-none" style="background-image: linear-gradient(rgba(99,102,241,0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.3) 1px, transparent 1px); background-size: 60px 60px;"></div>

    <!-- Login Container -->
    <div class="relative z-10 w-full max-w-md">

        <!-- Logo Section -->
        <div class="text-center mb-8 animate-fadeInUp">
            <div class="inline-flex w-20 h-20 rounded-2xl gradient-bg-primary items-center justify-center shadow-2xl mb-5 lock-icon">
                <i data-lucide="check-square" class="w-10 h-10 text-white"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-white font-display">Hitmo's Planner</h1>
            <p class="text-sm text-slate-400 mt-2 font-mono tracking-wide">Executive Performance & Task Management</p>
            <div class="text-center mt-3"><a href="/admin-login.html" class="text-xs text-indigo-400 hover:text-indigo-300">Admin Login</a></div>
            <div class="flex items-center justify-center gap-2 mt-4">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-xs text-slate-500 font-mono">System Online</span>
            </div>
        </div>

        <!-- Login Card -->
        <div class="auth-glass rounded-2xl p-8 shadow-2xl animate-slideUp stagger-children" style="animation-delay: 0.1s;">

            <!-- Tabs -->
            <div class="flex items-center gap-1 p-1 rounded-xl bg-slate-800/50 mb-8">
                <button id="loginTabBtn" onclick="switchAuthTab('login')" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all bg-white/10 text-white shadow-sm" data-tab="login" data-i18n="signIn">
                    Sign In
                </button>
                <button id="signupTabBtn" onclick="switchAuthTab('signup')" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-slate-200" data-tab="signup">
                    Sign Up
                </button>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="space-y-5 animate-fadeInUp">
                <div class="input-shine">
                    <label class="form-label" data-i18n="email">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-[38px] text-slate-500"></i>
                        <input type="email" id="loginEmail" required placeholder="you@example.com"
                            class="form-input form-input-glow pl-11">
                    </div>
                </div>
                <div class="input-shine">
                    <label class="form-label" data-i18n="password">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-[38px] text-slate-500"></i>
                        <input type="password" id="loginPassword" required placeholder="••••••••"
                            class="form-input form-input-glow pl-11">
                        <button type="button" onclick="togglePassword('loginPassword')" class="absolute right-3.5 top-[38px] text-slate-500 hover:text-slate-300">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-2.5 cursor-pointer group">
                        <input type="checkbox" class="w-4 h-4 rounded accent-indigo-500 focus:ring-indigo-500 focus:ring-offset-0">
                        <span class="text-slate-400 group-hover:text-slate-200 transition-colors">Remember me</span>
                    </label>
                    <button type="button" onclick="showPasswordHelp()" class="text-indigo-400 hover:text-indigo-300 font-semibold transition-colors">Forgot password?</button>
                </div>
                <button type="submit" onclick="handleLogin(event)" class="gradient-btn w-full py-3.5 rounded-xl text-white font-bold text-sm tracking-wide">
                    Sign In
                </button>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="space-y-5 hidden animate-fadeInUp">
                <div class="input-shine">
                    <label class="form-label">Full Name</label>
                    <div class="relative">
                        <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-[38px] text-slate-500"></i>
                        <input type="text" id="signupName" required placeholder="Cristiano Ronaldo"
                            class="form-input form-input-glow pl-11">
                    </div>
                </div>
                <div class="input-shine">
                    <label class="form-label">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-[38px] text-slate-500"></i>
                        <input type="email" id="signupEmail" required placeholder="you@example.com"
                            class="form-input form-input-glow pl-11">
                    </div>
                </div>
                <div class="input-shine">
                    <label class="form-label">Password</label>
                    <div class="relative">
                        <i data-lucide="shield" class="w-4 h-4 absolute left-3.5 top-[38px] text-slate-500"></i>
                        <input type="password" id="signupPassword" required minlength="8" placeholder="Min 8 characters"
                            class="form-input form-input-glow pl-11">
                    </div>
                </div>
                <label class="flex items-start gap-3 cursor-pointer text-xs">
                    <input type="checkbox" required class="w-4 h-4 rounded accent-indigo-500 mt-0.5">
                    <span class="text-slate-400">I agree to the <a href="#" class="text-indigo-400 hover:text-indigo-300 font-semibold">Terms of Service</a> and <a href="#" class="text-indigo-400 hover:text-indigo-300 font-semibold">Privacy Policy</a></span>
                </label>
                <button type="submit" onclick="handleSignup(event)" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-bold text-sm shadow-lg hover:shadow-xl transition-all" data-i18n="createAccount">
                    Create Account
                </button>
            </div>

            <!-- Divider -->
            <div class="relative my-7">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-700/50"></div></div>
                <div class="relative flex justify-center text-[10px] uppercase tracking-widest text-slate-500 bg-dark-bg px-3">Or continue with</div>
            </div>

            <!-- Social Login -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="showSocialLoginNotice('Google')" class="social-btn glass-card py-3 rounded-xl text-sm font-medium flex items-center justify-center gap-2 hover:bg-slate-800/50 group">
                    <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    <span class="text-slate-300 group-hover:text-white transition-colors">Google</span>
                </button>
                <button onclick="showSocialLoginNotice('GitHub')" class="social-btn glass-card py-3 rounded-xl text-sm font-medium flex items-center justify-center gap-2 hover:bg-slate-800/50 group">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    <span class="text-slate-300 group-hover:text-white transition-colors">GitHub</span>
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 animate-fadeInUp" style="animation-delay: 0.3s;">
            <p class="text-xs text-slate-500">© 2026 Hitmo's Planner. Built for champions.</p>
            <div class="flex items-center justify-center gap-4 mt-3">
                <a href="#" class="text-slate-500 hover:text-slate-300 text-xs transition-colors">Privacy</a>
                <span class="text-slate-700">•</span>
                <a href="#" class="text-slate-500 hover:text-slate-300 text-xs transition-colors">Terms</a>
                <span class="text-slate-700">•</span>
                <a href="#" class="text-slate-500 hover:text-slate-300 text-xs transition-colors">Support</a>
            </div>
            <div class="flex items-center justify-center gap-2 mt-4">
                <span class="text-[10px] text-slate-600 font-mono">v3.0</span>
                <span class="w-1 h-1 rounded-full bg-indigo-500"></span>
                <span class="text-[10px] text-slate-600 font-mono">Node + SQLite + AI</span>
            </div>
        </div>
    </div>

    <script src="js/quotes.js"></script>
    <script>
        lucide.createIcons();

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginBtn = document.getElementById('loginTabBtn');
            const signupBtn = document.getElementById('signupTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginBtn.className = 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all bg-white/10 text-white shadow-sm';
                signupBtn.className = 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-slate-200';
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                signupBtn.className = 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all bg-white/10 text-white shadow-sm';
                loginBtn.className = 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-slate-200';
            }
        }

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const icon = field.nextElementSibling.querySelector('i');
            if (field.type === 'password') {
                field.type = 'text';
                if (icon) icon.setAttribute('data-lucide', 'eye-off');
            } else {
                field.type = 'password';
                if (icon) icon.setAttribute('data-lucide', 'eye');
            }
            if (window.lucide) lucide.createIcons();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const result = await authManager.login(email, password);
            if (result.success) {
                window.location.replace('/app');
            } else {
                alert(result.error);
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const result = await authManager.register(name, email, password);
            if (result.success) {
                window.location.replace('/app');
            } else {
                alert(result.error);
            }
        }

        function showPasswordHelp() {
            alert('For this local build, password reset is not connected to an email service yet. Use the administrator account or create a new account.');
        }
        function showSocialLoginNotice(provider) {
            alert(`${provider} sign-in is not enabled in this local build. Please use email and password.`);
        }

        (async () => {
            if (await authManager.isAuthenticated()) {
                 window.location.replace('/app');
            }
        })();
    </script>
<script>document.documentElement.classList.toggle("light",localStorage.getItem("theme")==="light");document.documentElement.classList.toggle("dark",localStorage.getItem("theme")!=="light");document.addEventListener("DOMContentLoaded",()=>{if(window.i18n){i18n.applyLanguage();const s=document.getElementById("pageLanguage");if(s){s.value=i18n.getCurrentLanguage();s.onchange=()=>i18n.setLanguage(s.value);}}});</script></body>
</html>
