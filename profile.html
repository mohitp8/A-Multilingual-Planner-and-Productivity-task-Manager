<!DOCTYPE html><html lang="en" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Profile — Hitmo Planner</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css"><script src="https://unpkg.com/lucide@latest"></script><script src="js/i18n.js"></script><script src="js/auth.js"></script><script src="js/apiClient.js"></script></head>
<body class="bg-mesh-dark text-slate-100 min-h-screen p-5 md:p-10"><div class="fixed top-4 right-4 z-50"><select id="pageLanguage" class="form-input text-xs w-auto"><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option><option value="es">Español</option><option value="fr">Français</option><option value="pt">Português</option></select></div><main class="max-w-2xl mx-auto"><header class="flex items-center justify-between mb-8"><div><a href="/app" class="text-xs text-indigo-400">← Back to dashboard</a><h1 class="text-3xl font-bold mt-3" data-i18n="profile">Profile</h1></div><button id="logout" class="px-4 py-2 rounded-xl bg-rose-600 text-sm" data-i18n="logout">Logout</button></header><section class="glass-card rounded-2xl p-6 space-y-5"><div><label class="text-xs text-slate-500" data-i18n="name">Name</label><p id="name" class="text-lg font-semibold mt-1">—</p></div><div><label class="text-xs text-slate-500" data-i18n="email">Email</label><p id="email" class="mt-1">—</p></div><div><label class="text-xs text-slate-500" data-i18n="role">Role</label><p id="role" class="mt-1">—</p></div><div><label class="text-xs text-slate-500" data-i18n="userId">User ID</label><p id="id" class="mt-1 text-xs font-mono break-all text-slate-400">—</p></div><div><label class="text-xs text-slate-500" data-i18n="timezone">Timezone</label><input id="timezone" class="form-input w-full mt-1" value="Asia/Kolkata"></div><button id="save" class="px-5 py-2.5 rounded-xl bg-indigo-600 font-semibold" data-i18n="save">Save Profile</button><p id="status" class="text-sm text-slate-400"></p></section></main><script>(async()=>{if(!await authManager.isAuthenticated()){location.replace('/login.html');return;}const u=authManager.getUser();document.getElementById('name').textContent=u.name;document.getElementById('email').textContent=u.email;document.getElementById('role').textContent=u.role;document.getElementById('id').textContent=u.id;try{const p=await apiClient.request('/profile');document.getElementById('timezone').value=p.timezone||'Asia/Kolkata';}catch{}document.getElementById('save').onclick=async()=>{try{await apiClient.request('/profile','PUT',{timezone:document.getElementById('timezone').value});document.getElementById('status').textContent='Profile saved.'}catch(e){document.getElementById('status').textContent=e.message}};})();document.getElementById('logout').onclick=()=>authManager.logout();lucide.createIcons();</script><script>document.documentElement.classList.toggle("light",localStorage.getItem("theme")==="light");document.documentElement.classList.toggle("dark",localStorage.getItem("theme")!=="light");document.addEventListener("DOMContentLoaded",()=>{if(window.i18n){i18n.applyLanguage();const s=document.getElementById("pageLanguage");if(s){s.value=i18n.getCurrentLanguage();s.onchange=()=>i18n.setLanguage(s.value);}}});</script></body></html>
